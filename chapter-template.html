
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Title | Book Title</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d1216;
      color: #f5f0e6;
      font-family: Georgia, serif;
      line-height: 2;
    }

    header {
      padding: 22px 8%;
      border-bottom: 1px solid #343a3d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header a {
      color: #e1b373;
      text-decoration: none;
      font-size: 12px;
    }

    .brand {
      letter-spacing: 3px;
    }

    main {
      max-width: 780px;
      margin: auto;
      padding: 75px 25px;
    }

    .chapter-label {
      color: #e1b373;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
    }

    h1 {
      font-size: clamp(38px, 7vw, 55px);
      font-weight: normal;
      text-align: center;
      margin: 15px 0 10px;
    }

    .book-title {
      text-align: center;
      color: #aaa49b;
      font-size: 13px;
      margin-bottom: 65px;
    }

    .story p {
      margin-bottom: 25px;
      font-size: 17px;
    }

    .story strong {
      color: #e1b373;
    }

    .navigation {
      margin-top: 75px;
      padding-top: 30px;
      border-top: 1px solid #343a3d;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .navigation a {
      color: #e1b373;
      text-decoration: none;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid #343a3d;
      color: #aaa49b;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      main {
        padding: 50px 23px;
      }

      .story p {
        font-size: 16px;
      }
    }
    /* READING ROOM CONTROLS */

.reader-toolbar {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 auto 45px;
  padding: 18px;
  border: 1px solid #343a3d;
  border-radius: 8px;
}

.reader-toolbar p {
  width: 100%;
  text-align: center;
  color: #aaa49b;
  font-size: 11px;
  letter-spacing: 2px;
}

.mode-button {
  padding: 11px 20px;
  background: transparent;
  color: #e1b373;
  border: 1px solid #a17a42;
  cursor: pointer;
  font-family: Georgia, serif;
  font-size: 13px;
}

.mode-button.active {
  background: #e1b373;
  color: #0d1216;
}

/* HORIZONTAL READING */

body.horizontal-reading main {
  width: 100%;
  max-width: 100%;
  padding: 10px;
}

body.horizontal-reading .story {
  width: 100%;
  height: 75vh;
  overflow: hidden;
  position: relative;
  column-count: auto;
  column-width: auto;
  column-gap: 0;
  padding: 0;
  touch-action: pan-y;
}

body.horizontal-reading .story p {
  break-inside: avoid;
}

@media (max-width: 600px) {
  .reader-toolbar {
    gap: 8px;
  }

  .mode-button {
    padding: 10px 14px;
  }

  body.horizontal-reading .story {
    height: 75vh;
  }
}
  
    /* READING BACKGROUND THEMES */

body.theme-midnight {
  background: #0d1216;
  color: #f5f0e6;
}

body.theme-paper {
  background: #f5f0e6;
  color: #25221e;
}

body.theme-sepia {
  background: #e8dcc5;
  color: #493b2c;
}

/* Keep story text readable in every theme */

body.theme-paper .story strong,
body.theme-sepia .story strong {
  color: #8a642f;
}
  /* READING PROGRESS */
.reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  width: 100%;
  height: 5px;
  background: #343a3d;
  overflow: hidden;
  margin: 0;
}

.reading-progress-bar {
  width: 0%;
  height: 100%;
  background: #e1b373;
  transition: width 0.2s ease;
}
  /* PAGE TURNING CONTROLS */

.page-controls {
  display: none;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin: 15px 0;
  padding: 10px;
}

body.horizontal-reading .page-controls {
  display: flex;
}

.page-controls button {
  background: #e1b373;
  color: #151c21;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

.page-controls button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#pageNumber {
  color: inherit;
  font-size: 14px;
}
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="brand">LUMINOUS INK</a>
    <a href="book-page.html">Back to Book Title</a>
  </header>

  <main>
    <div class="chapter-label">CHAPTER NUMBER</div>
    <h1>Chapter Title</h1>
    <p class="book-title">Book Title · M.L.</p>
    <div class="reading-progress">
  <div class="reading-progress-bar" id="progressBar"></div>
    </div>
    <div class="reader-toolbar">

  <p>CHOOSE YOUR READING MODE</p>

  <button class="mode-button active" id="verticalBtn">
    ↓ Vertical
  </button>

  <button class="mode-button" id="horizontalBtn">
    → Horizontal
  </button>
<button class="mode-button" id="decreaseFont">
  A−
</button>

<button class="mode-button" id="increaseFont">
  A+
</button>
      <button class="mode-button" id="midnightBtn">
  Midnight
</button>

<button class="mode-button" id="paperBtn">
  Warm Paper
</button>

<button class="mode-button" id="sepiaBtn">
  Soft Sepia
</button>
    </div>
<div class="page-controls" id="pageControls">
  <button id="previousPage">← Previous</button>
  <span id="pageNumber">1 / 1</span>
  <button id="nextPage">Next →</button>
</div>
    
    <article class="story">

  <p>
    Write your chapter content here.
  </p>

    </article>

    <div class="navigation">
      <a href="book-page.html">← Book details</a>
      <span>Chapter Number of Book Title</span>
    </div>

  </main>

  <footer>
    © 2026 Luminous Ink · M.L.
    <p>Silence, Put Into Words.</p>
  </footer>

<script>
const progressBar = document.getElementById("progressBar");
const story = document.querySelector(".story");

const verticalBtn = document.getElementById("verticalBtn");
const horizontalBtn = document.getElementById("horizontalBtn");

const previousPageBtn = document.getElementById("previousPage");
const nextPageBtn = document.getElementById("nextPage");
const pageNumber = document.getElementById("pageNumber");

const originalStoryChildren = Array.from(story.children);

let pages = [];
let currentPage = 0;

function updateReadingProgress() {
  if (document.body.classList.contains("horizontal-reading")) {
    const progress = pages.length > 1
      ? (currentPage / (pages.length - 1)) * 100
      : 0;

    progressBar.style.width = progress + "%";
  } else {
    const storyTop = story.getBoundingClientRect().top + window.scrollY;
    const maxScroll = story.scrollHeight - window.innerHeight;

    const progress = maxScroll > 0
      ? ((window.scrollY - storyTop) / maxScroll) * 100
      : 0;

    progressBar.style.width =
      Math.min(100, Math.max(0, progress)) + "%";
  }
}

function createPage() {
  const page = document.createElement("div");

  page.className = "reader-page";
  page.style.width = "100%";
  page.style.height = "100%";
  page.style.overflow = "hidden";
  page.style.boxSizing = "border-box";
  page.style.position = "absolute";
  page.style.top = "0";
  page.style.left = "0";

  story.appendChild(page);
  pages.push(page);

  return page;
}

function buildPages() {
  const oldPage = currentPage;

  story.replaceChildren();
  pages = [];

  let page = createPage();

  originalStoryChildren.forEach(function (element) {
    page.appendChild(element);

    if (
      page.scrollHeight > page.clientHeight + 2 &&
      page.children.length > 1
    ) {
      page.removeChild(element);

      page = createPage();
      page.appendChild(element);
    }
  });

  currentPage = Math.min(oldPage, pages.length - 1);
  showPage(currentPage);
}

function showPage(number) {
  if (pages.length === 0) return;

  currentPage = Math.max(0, Math.min(number, pages.length - 1));

  pages.forEach(function (page, index) {
    page.style.display = index === currentPage ? "block" : "none";
  });

  pageNumber.textContent =
    (currentPage + 1) + " / " + pages.length;

  previousPageBtn.disabled = currentPage === 0;
  nextPageBtn.disabled = currentPage === pages.length - 1;

  updateReadingProgress();
}

function restoreVerticalReading() {
  story.replaceChildren(...originalStoryChildren);
  pages = [];
  currentPage = 0;

  progressBar.style.width = "0%";
}

verticalBtn.addEventListener("click", function () {
  document.body.classList.remove("horizontal-reading");

  restoreVerticalReading();

  verticalBtn.classList.add("active");
  horizontalBtn.classList.remove("active");

  updateReadingProgress();
});

horizontalBtn.addEventListener("click", function () {
  document.body.classList.add("horizontal-reading");

  horizontalBtn.classList.add("active");
  verticalBtn.classList.remove("active");

  buildPages();
});

previousPageBtn.addEventListener("click", function () {
  showPage(currentPage - 1);
});

nextPageBtn.addEventListener("click", function () {
  showPage(currentPage + 1);
});

/* SWIPE TO TURN PAGES */

let touchStartX = 0;

story.addEventListener("touchstart", function (event) {
  if (!document.body.classList.contains("horizontal-reading")) return;

  touchStartX = event.changedTouches[0].screenX;
});

story.addEventListener("touchend", function (event) {
  if (!document.body.classList.contains("horizontal-reading")) return;

  const touchEndX = event.changedTouches[0].screenX;
  const difference = touchStartX - touchEndX;

  if (difference > 50) {
    showPage(currentPage + 1);
  } else if (difference < -50) {
    showPage(currentPage - 1);
  }
});

/* READING THEMES */

const midnightBtn = document.getElementById("midnightBtn");
const paperBtn = document.getElementById("paperBtn");
const sepiaBtn = document.getElementById("sepiaBtn");

midnightBtn.addEventListener("click", function () {
  document.body.classList.remove("theme-paper", "theme-sepia");
  document.body.classList.add("theme-midnight");
});

paperBtn.addEventListener("click", function () {
  document.body.classList.remove("theme-midnight", "theme-sepia");
  document.body.classList.add("theme-paper");
});

sepiaBtn.addEventListener("click", function () {
  document.body.classList.remove("theme-midnight", "theme-sepia");
  document.body.classList.add("theme-sepia");
});

/* FONT SIZE CONTROLS */

const storyParagraphs = document.querySelectorAll(".story p");

const increaseFont = document.getElementById("increaseFont");
const decreaseFont = document.getElementById("decreaseFont");

let currentFontSize = 16;

function applyFontSize() {
  storyParagraphs.forEach(function (paragraph) {
    paragraph.style.fontSize = currentFontSize + "px";
  });

  if (document.body.classList.contains("horizontal-reading")) {
    buildPages();
  }
}

increaseFont.addEventListener("click", function () {
  if (currentFontSize < 26) {
    currentFontSize += 1;
    applyFontSize();
  }
});

decreaseFont.addEventListener("click", function () {
  if (currentFontSize > 12) {
    currentFontSize -= 1;
    applyFontSize();
  }
});

window.addEventListener("scroll", updateReadingProgress);
</script>

</body>
  </html>
